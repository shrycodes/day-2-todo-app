<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDO App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>

        <div>
            <input type="text" placeholder="Enter a task" class="inputElement">
            <button class="button">Add</button>
        </div>

        <p class="errorMsg"></p>

        <div class="filters">
            <button class="allBtn">All</button>
            <button class="doneBtn">Completed</button>
            <button class="pendingBtn">Pending</button>
        </div>

        <div>
            <ul class="taskList">

            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
